<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Umesh Chandran Yenugula — Full-Stack Engineer, React &amp; Go</title>
<meta name="description" content="Full-stack engineer in React, Next.js, TypeScript, Go and Python. Three flagship systems with live, interactive architectures: JñānaSetu, ViduraNīti and Flasio." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
<meta name="author" content="Umesh Chandran Yenugula" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23111'/%3E%3Ctext x='50' y='62' font-size='34' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='600'%3EUCY%3C/text%3E%3C/svg%3E" />
<script>
  // set the theme before first paint so there is no flash
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
